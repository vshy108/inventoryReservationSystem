# Railway deployment configuration for inventory-reservation-system.
# https://docs.railway.com/reference/config-as-code
#
# Setup on Railway dashboard:
#   1. New Project → Deploy from GitHub → select this repo
#   2. Add a PostgreSQL plugin → DATABASE_URL is injected automatically
#   3. Set environment variables (see below)
#   4. Railway detects the Dockerfile and builds automatically
#
# Required env vars (set in Railway dashboard):
#   INVENTORY_SEED   e.g. "sku-1:100,sku-2:50,sku-3:25"
#
# Optional env vars:
#   REDIS_URL        injected by Railway Redis plugin (adds distributed locking)
#   INVENTORY_HOLD   reservation hold duration, default 2m  (e.g. "5m")
#   INVENTORY_EXPIRY_INTERVAL  sweep interval, default 10s

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
